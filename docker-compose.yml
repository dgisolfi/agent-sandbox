name: agent-sandbox

networks:
  sandbox-net:
    driver: bridge

volumes:
  ollama-data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - sandbox-net
    ports:
    # To avoid conflict with ollama on host machine
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  model-init:
    image: curlimages/curl:latest
    container_name: model-init
    networks:
      - sandbox-net
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        echo "Pulling qwen2.5-coder:7b..."
        curl -sf --max-time 3600 \
          -X POST http://ollama:11434/api/pull \
          -H "Content-Type: application/json" \
          -d '{"model":"qwen2.5-coder:7b","stream":false}'
        echo "Model ready."

  sandbox:
    build:
      dockerfile: Dockerfile
    container_name: sandbox
    restart: unless-stopped
    networks:
      - sandbox-net
    ports:
      - "8000:8000"
    volumes:
      - ./workspace/${EXPERIMENT_ID:-fibonacci}:/workspace
    user: root
    environment:
      - WORKSPACE_DIR=/workspace
      - EXECUTION_TIMEOUT=30
      - PYTHONUNBUFFERED=1
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent:
    build:
      dockerfile: Dockerfile
      target: agent
    container_name: agent
    restart: "no"
    networks:
      - sandbox-net
    depends_on:
      ollama:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    volumes:
      - ./experiments:/experiments:ro
      - ./workspace/${EXPERIMENT_ID:-fibonacci}:/workspace
      - ./agent/logs:/logs
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - SANDBOX_URL=http://sandbox:8000
      - EXPERIMENTS_DIR=/experiments
      - WORKSPACE_DIR=/workspace
      - LOG_LEVEL=INFO
      - MAX_ITERATIONS=100
      - ERROR_THRESHOLD=5
